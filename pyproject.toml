[project]
name = "homeassistant-beenthere"
version = "1.1.0"
description = "Home Assistant travel map: log the countries and regions you have been to"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.beenthere"]
